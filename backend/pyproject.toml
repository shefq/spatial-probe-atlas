[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-probe-atlas"
version = "1.0.0"
description = "Local-first Spatial Probe Atlas backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.135.1", "uvicorn[standard]==0.35.0", "pydantic==2.12.5",
  "SQLAlchemy==2.0.43", "alembic==1.16.4", "numpy==2.2.6",
  "PyYAML==6.0.2", "jsonschema==4.25.1", "python-multipart==0.0.20", "psutil==7.0.0",
  "record3d==1.4.1; platform_system == 'Windows'",
  "opencv-python-headless==4.12.0.88", "scipy==1.16.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "httpx==0.28.1", "pytest-asyncio==1.1.0"]

[project.scripts]
spatial-probe-atlas = "spatial_probe_atlas.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../tests"]
pythonpath = ["src"]
